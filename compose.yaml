name: persephone
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://halloween.konradkowalczyk.com}
      HOST_PASSWORD: ${HOST_PASSWORD:?Set HOST_PASSWORD in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env}
      # nginx is always in front, so rate limits key on X-Forwarded-For
      TRUST_PROXY: '1'
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-200}
      SIGNATURE_THRESHOLD: ${SIGNATURE_THRESHOLD:-0.5}
    volumes:
      - mission-data:/app/data
    mem_limit: 192m
    cpus: 0.75
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    ports:
      # Locally 127.0.0.1:8080. On Mikrus: just a free port number (e.g. 8081), bound to all interfaces
      # so the Mikrus domain proxy can reach it - same pattern as UJ sprawozdania.
      - '${HTTP_PUBLISH:-127.0.0.1:8080}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
volumes:
  mission-data:
